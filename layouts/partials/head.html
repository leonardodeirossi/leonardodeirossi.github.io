    <style>
        @font-face {
            font-family: morn-demibold;
            src: url("/assets/fonts/morn-demibold.ttf");
        }

        :root {
            --bs-primary-rgb: 30, 78, 121;
        }

        .site-title {
            display: flex;
            align-items: center;
            font-size: 26px;
            font-family: morn-demibold;
            color: white;
            text-decoration: none;
            letter-spacing: -1px;
            margin-bottom: 0;
            float: left;
        }

        .morn-demibold {
            font-family: morn-demibold;
        }

        .rounded-image {
            border-radius: 50%;
        }

        .site-footer {
            background-color: #EEEEEE;
            border-top: 1px solid #e8e8e8;
            padding: 30px 0 0 0;
        }

        .page-card-header {
            color: white;
            background-color: rgb(var(--bs-primary-rgb));
        }

        table>thead>tr>th {
            background-color: #F2F2F2 !important;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .hover-underline:hover {
            text-decoration: underline !important;
        }
