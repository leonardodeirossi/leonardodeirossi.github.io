    <style>
        #output {
            background: #000;
            color: #0f0;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            border: 1px solid #444;
            margin-top: 10px;
        }

        /* Stile per l'input finto del terminale */
        .term-input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: monospace;
            font-size: 1em;
            outline: none;
            width: 60%;
        }
    </style>
</head>

<body>
    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col col-6">
                <div class="card">
                    <h5 class="card-header">Codice sorgente</h5>
                    <div class="card-body">
                        <textarea id="sourceCode" class="form-control" rows="10"></textarea>

                        <br>

                        <center>
                            <button id="runBtn" class="btn btn-primary" onclick="eseguiProgramma()">Compila ed
                                Esegui</button>
                        </center>
                    </div>
                </div>
            </div>

            <div class="col col-6">
                <div class="card">
                    <h5 class="card-header">Output del programma</h5>
                    <div class="card-body">
                        <div id="output"></div>

                        <br>

                        <h5>Bytecode (Codice "compilato")</h5>
                        <div id="bytecodeOutput"
                            style="font-family: monospace; font-size: 12px; color: #aaa; white-space: pre; border: 1px solid white;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../../assets/js/jquery-3.7.1.min.js"></script>
    <script src="pseudocode.js"></script>
</body>

</html>
